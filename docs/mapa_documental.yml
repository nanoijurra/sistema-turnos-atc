# Mapa documental del sistema ATC
version_esquema: 1
base_cerrada: v112
revision_documental: v113
cierre_v113_confirmado: false
alcance: "Documentos conocidos por auditoria v111 e inventario aportado; verificar localmente"
reglas:
  - "Canonicos: revision humana; no reescritura conceptual automatica"
  - "Historicos: conservar; no usarlos como estado vigente"
  - "Derivados: generacion futura; actualmente manuales y desactualizados"
  - "Fuentes explican evidencia; dependencias declaran rutas documentales"
  - "Auditar no equivale a reparar ni a actualizar contenido"
